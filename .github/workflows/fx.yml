# The one file to copy into a repo. One job, three things:
#
#   an issue is opened or edited  → one short note from something that has read
#                                   the code and its history, refreshed in place
#                                   when the issue changes
#   /fx <question>                → an answer, read-only with a scratch shell,
#                                   on any issue or PR
#   /fx pr <what to build>        → a draft pull request
#
# The action tells the three apart by event and by the word after /fx, so the
# job does not have to. Copy it to .github/workflows/fx.yml, add the
# AI_GATEWAY_API_KEY secret, and for `/fx pr` switch on Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests", which
# GitHub leaves off by default. This repo runs the same file on itself with
# `uses: ./`; CI keeps the two copies identical.
#
# No automatic PR review here on purpose. A PR you wrote with a stronger agent
# does not need this one's opinion, and a PR fx wrote should not be graded by
# fx. `/fx is this ready?` on a PR still works: the diff is in the prompt.

name: fx

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  fx:
    # Only people with write access, never a bot. The `if:` skips without
    # booting a runner; the action checks both again and fails the run if
    # either is wrong. On an issue event the note runs; on a comment, the
    # phrase has to be there.
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.issue.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/fx') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One group per event and issue. A burst of edits to an issue: the last
    # note wins. Comments queue instead, so a plain comment (which this job
    # skips) can never take out a /fx answer in progress. At workflow level
    # `github.job` is empty, so keep this on the job.
    concurrency:
      group: fx-${{ github.event_name }}-${{ github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'issues' }}
    # `contents: write` is what lets `/fx pr` push a branch and the memory
    # file reach its own branch. fx itself never holds this token, and
    # branch protection is what stops a push to your default branch. For
    # answers only: `contents: read`, drop `pull-requests`, add
    # `memory: false`.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history, so `git log -S` and `git blame` answer "this used
          # to work". A second or two on a normal repo; set a depth on a huge one.
          fetch-depth: 0

      - uses: ./
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          # Scratch mode for questions and notes: a shell and edits that are
          # thrown away, so the agent can run the tests or try a fix before
          # it answers. `/fx pr` gets the full tool set and a draft PR.
          shell: true
          max_steps: '60'
          # Nothing else to set. The note prompt is built in (prompts/issue.md
          # in the action) and a repo replaces it by adding .github/fx/issue.md.
          # Facts about the repo go in AGENTS.md. Memory is on: one MEMORY.md
          # on an `agent-memory` branch that the agent reads and edits each
          # run, saved only from runs by people with write access; delete the
          # branch to forget, `memory: false` to turn it off.
          # To put code on a stronger model than questions, uncomment:
          # pr_model: anthropic/claude-sonnet-5
