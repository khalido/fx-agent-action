name: fx agent
description: Answer a question or make the change, on a GitHub issue or PR. Reads the thread, works in your own runner, posts one comment. Read-only unless asked for a pull request.
author: khalido
branding:
  icon: message-square
  color: gray-dark

# A composite action on purpose: every step is shell you can read in the
# browser, there is no bundled dist/ to trust, and `gh` and `jq` are already on
# every GitHub runner. The agent logic lives in fx; the GitHub logic lives in
# scripts/, a handful of short files, all readable.
#
# What the agent may do to your repository is decided by the WORKFLOW's
# `permissions:` block, not by anything in here. Read-only notes want
# `contents: read` + `issues: write`. A run that opens pull requests wants
# `contents: write` + `pull-requests: write`, and branch protection on your
# default branch is what makes "at most a PR" true rather than hoped for.

inputs:
  prompt:
    description: >-
      What to ask. The issue or PR thread is appended below it. Leave it
      empty and the text after the trigger phrase in the comment becomes the
      prompt, which is how "/fx does the sync engine already cover
      this?" works.
    required: false
    default: ''
  prompt_file:
    description: >-
      A file in the checked-out repo holding the instructions. When it exists
      it is used instead of `prompt`; when it does not and `prompt` is set, the
      inline prompt runs and a notice says so. That is how one workflow file
      serves many repos: the inline prompt is the default, the file is a repo's
      override. Missing with no `prompt` is an error.
    required: false
    default: ''
  model:
    description: Any AI Gateway model id, e.g. `deepseek/deepseek-v4.1-flash`, `zai/glm-5.3-flash`, `anthropic/claude-sonnet-5`.
    required: false
    default: deepseek/deepseek-v4.1-flash
  pr_model:
    description: >-
      The model for write runs, the ones that end in a pull request, when it
      should differ from `model`. Writing code pays for a stronger model in a
      way a note does not. Empty means the same model for both.
    required: false
    default: ''
  mode:
    description: >-
      `auto` (default) lets the comment decide: `/fx <question>` answers
      in a comment and cannot write, `/fx pr <what to build>` gets the
      edit and shell tools and opens a pull request. `read` and `write` force
      one or the other and ignore the verb. In every case read mode DENIES the
      edit and shell tools outright, so the model never sees them.
    required: false
    default: auto
  shell:
    description: >-
      Scratch mode: the shell and the edit tools in read mode too, so the agent
      can run `git log`, try a fix and run the tests before it answers. Nothing
      is committed or opened; the checkout is thrown away. The shell can read
      the runner's environment, key included, so this does not combine with
      `allowed_non_write_users`. Write mode always has both.
    required: false
    default: 'false'
  memory:
    description: >-
      A memory across runs, on by default: one `MEMORY.md` on an orphan
      branch, copied into the workspace before the run and pushed back after
      it if the agent changed it. The default branch is never touched. The
      push needs `contents: write` on the job; without it the run notes that
      and goes on. Needs a mode that can edit, `shell: true` or `pr`; plain
      read mode sees the memory but cannot change it. `false` turns it off.
    required: false
    default: 'true'
  memory_branch:
    description: The branch that holds `MEMORY.md`. Created on first write, deletable any time.
    required: false
    default: agent-memory
  memory_repo:
    description: >-
      `owner/repo` holding the memory branch when it is not this repo, e.g.
      the org's `.github` repo for one memory across an org. Needs a
      `github_token` that can write there.
    required: false
    default: ''
  memory_lines:
    description: >-
      Line cap. The agent is told to keep under it; when a run leaves the
      file over it, one extra model call compacts it before the push.
    required: false
    default: '80'
  skills:
    description: >-
      Copy the skills shipped with this action (`skills/`) and any under the
      repo's `.github/fx/skills/` into fx's skill directory on the runner, so
      the agent can use them there and nowhere else. A repo's own skill
      folders (`skills/`, `.claude/skills/`, `.agents/skills/`) are seen
      anyway.
    required: false
    default: 'true'
  trigger:
    description: >-
      The phrase that aims a comment at the agent. Matched as a whole word
      anywhere in the comment, any case, outside quoted lines; the request is
      what follows it. Several, comma-separated, are all accepted: `/fx, /agent`.
      A slash phrase rather than a mention because `@fx` is a real person on
      GitHub and would be paged; `@fx-agent` works too, if you prefer a mention.
    required: false
    default: /fx
  allowed_non_write_users:
    description: >-
      On issue and pull request events the actor must have write access to
      this repository, or the run fails. Comma-separated logins to exempt, or
      `*` for anyone. Only combines with `mode: read` — the run fails
      otherwise — because the most a stranger should be able to do is be the
      issue the agent reads.
    required: false
    default: ''
  allowed_bots:
    description: >-
      A bot actor is rejected on every event unless listed here — that is
      what keeps two bots from triggering each other forever. Comma-separated
      names with or without `[bot]`, or `*`. Scheduled runs are attributed to
      whoever last edited the cron line; if that was a bot, list it.
    required: false
    default: ''
  branch_prefix:
    description: Branch names for pull requests the agent opens.
    required: false
    default: fx
  max_steps:
    description: Hard cap on the agent's tool loop. 0 means unlimited.
    required: false
    default: '30'
  effort:
    description: >-
      Reasoning effort, for models that support it: `none`, `minimal`, `low`,
      `medium`, `high`, `xhigh`, `max`. Empty leaves fx's `auto`. The cheapest
      lever on a note that comes out shallow.
    required: false
    default: ''
  post:
    description: >-
      `comment` (default) posts the answer on the triggering issue or PR,
      updating its own previous comment in place. `none` posts nothing and
      leaves the answer on the `response` output for a later step — which is
      what a release review or a scheduled job wants.
    required: false
    default: comment
  comment_key:
    description: >-
      A short word that keeps this job's comment apart from another fx job's on
      the same thread. An issue note (`comment_key: note`) and a `/fx` answer
      then live in two comments, each updated in place. Letters, digits and
      dashes.
    required: false
    default: ''
  issue_number:
    description: Which issue or PR to read and comment on. Defaults to the one that triggered the run.
    required: false
    default: ''
  include_thread:
    description: Give the agent the whole comment thread, not just the title and body.
    required: false
    default: 'true'
  include_diff:
    description: On a pull request, give the agent the diff as well.
    required: false
    default: 'true'
  max_cost:
    description: >-
      Fail the step when the run costs more than this many US dollars. A
      tripwire, not a brake. The real brake is a budget on the AI Gateway key
      itself (`vercel ai-gateway api-keys create --limit 10`), which the
      gateway enforces with a 402. 0 disables it. A write run that trips it
      still opens its draft PR: the work is done and throwing it away helps
      nobody.
    required: false
    default: '1'
  github_token:
    description: >-
      Defaults to the workflow's own token, which posts as github-actions[bot].
      Pass a GitHub App installation token (see actions/create-github-app-token)
      to give the bot its own name and avatar, and to let anything it opens
      trigger other workflows.
    required: false
    default: ${{ github.token }}
  session_artifact:
    description: >-
      Upload the whole fx session as one self-contained HTML file you can open
      from the run page — every tool call, its arguments and its result. It is
      what you read when an answer comes out wrong. Kept 7 days.
    required: false
    default: 'true'
  working_directory:
    description: >-
      The directory fx treats as its workspace, in every mode. A pull request
      is always built from the repository root, whatever this says.
    required: false
    default: '.'

outputs:
  response:
    description: The agent's final answer, as markdown.
    value: ${{ steps.run.outputs.response }}
  cost:
    description: What the run cost, in US dollars, including the `fx pr` draft when there was one.
    value: ${{ steps.memory_save.outputs.cost || steps.pr.outputs.cost || steps.run.outputs.cost }}
  steps:
    description: How many tool-loop steps the agent took.
    value: ${{ steps.run.outputs.steps }}
  comment_url:
    description: 'The comment that was posted or updated, when post is comment.'
    value: ${{ steps.comment.outputs.url }}
  pr_url:
    description: The pull request the agent opened, when it wrote anything.
    value: ${{ steps.pr.outputs.pr_url }}
  session_id:
    description: The fx session id, for `fx session <id>` locally.
    value: ${{ steps.run.outputs.session_id }}

runs:
  using: composite
  steps:
    # Two checks before anything else, and the run fails if either says no:
    # write access on issue and PR events, and a human (or listed bot) on every
    # event. The workflow's `if:` is still worth having — it saves booting a
    # runner — but it is a filter, and this is the check.
    - name: Check who asked
      id: actor
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
        SENDER_TYPE: ${{ github.event.sender.type }}
        ALLOWED_NON_WRITE_USERS: ${{ inputs.allowed_non_write_users }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        MODE: ${{ inputs.mode }}
        SHELL_TOOL: ${{ inputs.shell }}
      run: bash "${{ github.action_path }}/scripts/check-actor.sh"

    # 👀 on the triggering comment, before anything slow, so a two-minute run
    # doesn't look like nothing happened. Removed again at the end — it is a
    # spinner, not a badge. Copied from shaftoe/pi-coding-agent-action, which
    # also taught us that an inline PR review comment is a different endpoint.
    - name: React to the comment
      id: react
      if: ${{ github.event.comment.id != '' || github.event_name == 'issues' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMENT_ID: ${{ github.event.comment.id }}
        REVIEW_COMMENT: ${{ github.event.comment.pull_request_review_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: bash "${{ github.action_path }}/scripts/react.sh" add

    # fx ships weekly and there is no version input on purpose: pinning an
    # agent to an old release ages badly, and the whole value here is that fx
    # keeps getting better. The tag is resolved only to key the cache.
    - name: Resolve the fx version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        # The same file setup.sh reads, so the cache key and the binary it
        # installs name the same release even if one lands mid-run.
        tag=$(curl -fsSL https://releases.fx.sh/latest.txt 2>/dev/null | tr -d '[:space:]' || true)
        case "$tag" in v[0-9]*) ;; *) tag='' ;; esac
        # actions/cache never overwrites an existing key, so a FIXED fallback
        # would pin whatever binary happened to be cached the day the API was
        # rate-limited, forever. A dated one self-heals the next day.
        echo "tag=${tag:-unresolved-$(date -u +%Y-%m-%d)}" >> "$GITHUB_OUTPUT"

    # fx is a single static binary, so caching it turns a download into a
    # restore. Keyed on the resolved tag, so a new release busts it.
    - name: Restore fx from the cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.local/bin/fx
        key: fx-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}

    # The resolved tag is passed through when there is one, so the installed
    # binary is the one the cache key names. Without a tag, latest.
    - name: Install fx
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        case "$TAG" in
          v[0-9]*) curl -fsSL https://fx.sh/setup.sh | bash -s -- "$TAG" ;;
          *)       curl -fsSL https://fx.sh/setup.sh | bash ;;
        esac

    # FX_AUTO_UPGRADE=0: fx checks for a newer release on start and can
    # install it in place. In CI that is a second download of a binary we just
    # restored from cache, and a run that does not match the version it logged.
    - name: Put fx on PATH
      shell: bash
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "FX_AUTO_UPGRADE=0" >> "$GITHUB_ENV"

    # The memory file lands in the workspace before the prompt is built, so
    # build-prompt.sh can quote it, and before the tree snapshot, so an edit
    # to it is never counted as the agent's change to the repo.
    - name: Fetch memory
      id: memory
      if: ${{ inputs.memory == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MEMORY_REPO: ${{ inputs.memory_repo }}
        MEMORY_BRANCH: ${{ inputs.memory_branch }}
        MEMORY_LINES: ${{ inputs.memory_lines }}
      run: bash "${{ github.action_path }}/scripts/memory.sh" fetch

    - name: Build the prompt
      id: context
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt_file }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INCLUDE_THREAD: ${{ inputs.include_thread }}
        INCLUDE_DIFF: ${{ inputs.include_diff }}
        INPUT_TRIGGER: ${{ inputs.trigger }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SHELL: ${{ inputs.shell }}
        MAX_STEPS: ${{ inputs.max_steps }}
        MEMORY_PATH: ${{ steps.memory.outputs.memory_path }}
        MEMORY_LINES: ${{ inputs.memory_lines }}
        MEMORY_WRITABLE: ${{ steps.actor.outputs.write_access }}
      run: bash "${{ github.action_path }}/scripts/build-prompt.sh"

    # One config file per run, written globally (~/.fx/settings.json) rather
    # than under a workspace profile, because the checkout path varies.
    #
    # `models` is keyed by provider, so the gateway's default model is
    # `models.gateway`. Setting it here rather than through FX_MODEL keeps one
    # owner for the value.
    #
    # The two modes are not the same mechanism:
    #
    #  read  — `auto` plus deny rules on edit and shell. The rules HIDE those
    #          tools from the model, so it never spends a step discovering it
    #          cannot write and the run still exits 0. A question has no
    #          business running commands, and a model with no shell cannot
    #          read the runner's environment back to you.
    #          With `shell: true`, the shell AND the edit tools are allowed by
    #          rule instead (no automatic review, so no helper-model bill per
    #          call): scratch mode. Nothing in this mode is committed or
    #          opened, so the checkout is scratch paper, and the memory file
    #          is the one edit that outlives the run.
    #  write — `full-access`. The runner is a throwaway container and the real
    #          boundary is the workflow's token scope, so fx's own review layer
    #          only adds latency and a separate billed model request per
    #          unresolved call. Verified headless: no acknowledgement prompt.
    #
    # Never full-access in read mode: it disables the checks the deny rules
    # ride on.
    #
    # Web search needs no key. On the AI Gateway fx uses Exa by default and
    # bills it through the same gateway key.
    #
    # The checkout can carry a `.fx.json`, and fx honours three of its fields:
    # max_agent_steps, max_tool_result_bytes, context. The global profile
    # written here outranks it (verified: a repo file saying 7 steps loses to
    # 30 in this file), so the three are set explicitly rather than left to
    # whatever branch is checked out. model and permission_mode in a repo file
    # are refused by fx itself.
    #
    # Then two assertions. A settings file fx cannot parse is dropped WHOLE,
    # silently, and the run continues on defaults: auto mode, no deny rules,
    # fx's own default model. So the rules and the mode are read back before
    # anything runs. Rule KEYS are not validated by fx — a misspelled one is
    # stored and echoed — so the read-back proves the file parsed, not that the
    # names are the right ones; `edit` and `shell` are the two measured to bind.
    - name: Configure fx
      id: configure
      shell: bash
      env:
        MODE: ${{ steps.context.outputs.mode }}
        SHELL_TOOL: ${{ inputs.shell }}
        MODEL: ${{ inputs.model }}
        PR_MODEL: ${{ inputs.pr_model }}
        MAX_STEPS: ${{ inputs.max_steps }}
        EFFORT: ${{ inputs.effort }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.fx"
        steps="${MAX_STEPS:-30}"
        # One rule for which model runs: write mode takes pr_model when set.
        [ "$MODE" = "write" ] && [ -n "$PR_MODEL" ] && MODEL="$PR_MODEL"
        echo "model=$MODEL" >> "$GITHUB_OUTPUT"
        common=$(jq -n --arg model "$MODEL" --argjson steps "$steps" --arg effort "$EFFORT" \
          '{models:{gateway:$model}, max_agent_steps:$steps, max_tool_result_bytes:65536, context:true}
           + (if $effort != "" then {effort:$effort} else {} end)')
        if [ "$MODE" = "read" ]; then
          # shell: true is scratch mode: shell AND edits, so the agent can try
          # a fix and run the tests before it answers. Nothing is kept either
          # way. Without it, both tools are hidden and the run is read-only.
          tool_rule=deny; [ "$SHELL_TOOL" = "true" ] && tool_rule=allow
          printf '%s' "$common" | jq --arg r "$tool_rule" \
            '. + {permission_mode:"auto", permission:{edit:{"*":$r}, shell:{"*":$r}}}' \
            > "$HOME/.fx/settings.json"
          want_mode=auto
        else
          printf '%s' "$common" | jq '. + {permission_mode:"full-access"}' > "$HOME/.fx/settings.json"
          want_mode=yolo   # fx reports full-access as its legacy name
        fi

        rules=$(fx permissions --json 2>/dev/null | jq -c '[.rules[] | "\(.permission)=\(.action)"]')
        status=$(fx status --json 2>/dev/null | jq -r '"\(.permission_mode) \(.model) \(.agent_step_limit)"')
        echo "fx configured: $MODE mode, shell $SHELL_TOOL; rules $rules; status: $status" >&2
        [ "$status" = "$want_mode $MODEL $steps" ] \
          || { echo "::error::fx did not take the settings written for it (wanted '$want_mode $MODEL $steps', got '$status'). The settings file may be malformed; nothing ran." >&2; exit 1; }
        if [ "$MODE" = "read" ]; then
          printf '%s' "$rules" | jq -e --arg r "$tool_rule" 'index("edit=\($r)") != null and index("shell=\($r)") != null' >/dev/null \
            || { echo "::error::read-mode permission rules did not register: $rules" >&2; exit 1; }
        fi
        fx doctor --json 2>/dev/null | jq -r '"fx doctor: \(.ok_count) ok, \(.warn_count) warn, \(.fail_count) fail; " + ([.checks[] | select(.status != "ok") | "\(.name): \(.detail)"] | join("; "))' >&2 || true

    # fx discovers skills from the workspace upward and from ~/.fx/skills/,
    # and this action's own checkout under _actions/ is neither. So the skills
    # shipped here, and any a repo keeps under .github/fx/skills/, are copied
    # into ~/.fx/skills/ on the runner: visible to fx in this run, invisible to
    # every other agent. One catalog line per skill; instructions load when
    # invoked. A repo's root-level skill folders need no copy.
    - name: Install skills
      if: ${{ inputs.skills == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.fx/skills"
        names=()
        for src in "$GITHUB_ACTION_PATH/skills" .github/fx/skills; do
          [ -d "$src" ] || continue
          for d in "$src"/*/; do
            d="${d%/}"
            [ -f "$d/SKILL.md" ] || continue
            # rm first: cp -R into an existing directory nests instead of
            # replacing, so a repo's skill could never shadow a shipped one.
            rm -rf "$HOME/.fx/skills/$(basename "$d")"
            cp -R "$d" "$HOME/.fx/skills/$(basename "$d")"
            names+=("$(basename "$d")")
          done
        done
        echo "skills installed: ${#names[@]}${names[*]:+ (${names[*]})}" >&2

    # What the workspace looked like BEFORE the agent touched it, so the pull
    # request carries only its changes and not a previous step's build output.
    # A tree object, written to a scratch index so the real one is untouched —
    # `git status` text cannot tell "already dirty" from "dirty in the same
    # way", and collapses an untracked directory to a single line.
    # A fingerprint of this action's own action.yml and scripts/, taken before
    # fx can write to disk and kept as a step output — in the runner's memory,
    # out of reach of anything fx does to the filesystem. The steps after fx
    # run scripts from that directory with a token: one that can push, in
    # write mode, or post comments, in any mode. An agent talked into editing
    # open-pr.sh could otherwise push to the default branch, and on a
    # free-plan private repo branch protection is not there to stop it.
    - name: Fingerprint the action
      id: fingerprint
      if: ${{ steps.context.outputs.mode == 'write' || inputs.shell == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Per-file hashes, so a mismatch can name the file. __pycache__ is
        # skipped: running the repo's own `py_compile` check creates it, and
        # nothing here executes a .pyc.
        {
          echo "action_files<<FX_EOF"
          find "$GITHUB_ACTION_PATH/action.yml" "$GITHUB_ACTION_PATH/scripts" -type f -not -path '*/__pycache__/*' -print0 \
            | sort -z | xargs -0 sha256sum
          echo "FX_EOF"
        } >> "$GITHUB_OUTPUT"

    # The tree before fx touched it, so the PR carries only its changes.
    - name: Note the working tree
      if: ${{ steps.context.outputs.mode == 'write' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        cd "$(git rev-parse --show-toplevel)"
        export GIT_INDEX_FILE="$RUNNER_TEMP/fx-index-before"
        git add -A -- .
        git write-tree > "$RUNNER_TEMP/fx-tree-before"

    - name: Run fx
      id: run
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PROMPT_PATH: ${{ steps.context.outputs.prompt_path }}
        MAX_COST: ${{ inputs.max_cost }}
      run: bash "${{ github.action_path }}/scripts/run-fx.sh"

    # Inline, not a script: a script here would be read from the directory it
    # is checking. On a mismatch the run fails before any step that holds the
    # token runs a file from that directory.
    - name: Check the action's own files
      id: integrity
      if: ${{ !cancelled() && (steps.context.outputs.mode == 'write' || inputs.shell == 'true') }}
      shell: bash
      env:
        BEFORE: ${{ steps.fingerprint.outputs.action_files }}
        MODE: ${{ steps.context.outputs.mode }}
      run: |
        set -euo pipefail
        [ -n "$BEFORE" ] || { echo "::error::no fingerprint was taken before the run" >&2; exit 1; }
        changed=$(diff <(printf '%s\n' "$BEFORE") \
          <(find "$GITHUB_ACTION_PATH/action.yml" "$GITHUB_ACTION_PATH/scripts" -type f -not -path '*/__pycache__/*' -print0 \
              | sort -z | xargs -0 sha256sum) \
          | grep '^[<>]' | awk '{print $NF}' | sort -u | tr '\n' ' ') || true
        [ -z "$changed" ] && exit 0
        # Dogfood: with `uses: ./` the action path IS the checkout, and scratch
        # mode lets the agent edit the checkout on purpose. In read mode that is
        # scratch paper and nothing is pushed, so warn and go on; write mode
        # stays strict, because the edited scripts would push with a token.
        if [ "$MODE" = "read" ] && [ "$(realpath "$GITHUB_ACTION_PATH")" = "$(realpath "$GITHUB_WORKSPACE")" ]; then
          # Put the committed scripts back before the steps that hold a token
          # run them. Scratch edits are thrown away anyway; this makes sure the
          # ones to the action itself are thrown away first. Seen live: an
          # agent rewrote memory.sh while answering a question about it, and
          # the Save memory step then ran the agent's version.
          git -C "$GITHUB_WORKSPACE" checkout -q -- action.yml scripts
          git -C "$GITHUB_WORKSPACE" clean -fdq -- scripts
          echo "::warning::fx edited this action's own files in a scratch run on the action's own repo: $changed. Reverted to the committed versions before continuing." >&2
          exit 0
        fi
        echo "::error::fx changed this action's own files during the run: $changed. Refusing to open a PR or post with them." >&2
        exit 1

    # The session as one HTML page, on the run. Both prior arts ship something
    # like this and it is the difference between "the note is wrong" and
    # knowing why. Rendered from `fx session <id> --json`, secrets stripped —
    # a tool result can quote a file, and an artifact leaves the runner.
    - name: Render the session
      id: session
      if: ${{ always() && steps.integrity.outcome != 'failure' && inputs.session_artifact == 'true' && steps.run.outputs.session_id != '' }}
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working_directory }}
      env:
        SESSION_META: >-
          ${{ steps.configure.outputs.model }} · ${{ steps.run.outputs.steps }} steps ·
          ${{ steps.run.outputs.duration }}s · fx ${{ steps.run.outputs.fx_version }}
      run: |
        python3 "${{ github.action_path }}/scripts/session-html.py" \
          "${{ steps.run.outputs.session_id }}" "$RUNNER_TEMP/fx-session.html"
        [ -s "$RUNNER_TEMP/fx-session.html" ] && echo "wrote=true" >> "$GITHUB_OUTPUT" || true

    - name: Upload the session
      if: ${{ always() && steps.session.outputs.wrote == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: fx-session-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/fx-session.html
        retention-days: 7

    # !cancelled(), not always(): the run can FAIL after fx has edited the
    # tree — the cost tripwire in particular — and that work should still
    # become a PR. A CANCELLED run is different: a newer comment superseded it
    # mid-edit, and pushing half-finished edits helps nobody.
    - name: Open a pull request
      id: pr
      if: ${{ !cancelled() && steps.context.outputs.mode == 'write' && steps.integrity.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        RESPONSE_PATH: ${{ steps.run.outputs.response_path }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      run: bash "${{ github.action_path }}/scripts/open-pr.sh"

    # After the PR, so a compaction's spend is in the ledger before the footer
    # reads it; gated on the integrity check like everything that holds a
    # token; never fails the run. And only when the actor has write access:
    # an allowed stranger's or bot's run reads the memory and cannot change
    # what future runs read. Deterministic, in the workflow, not the prompt.
    - name: Save memory
      id: memory_save
      if: ${{ !cancelled() && steps.integrity.outcome != 'failure' && steps.memory.outputs.memory_path != '' && steps.actor.outputs.write_access == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MEMORY_REPO: ${{ inputs.memory_repo }}
        MEMORY_BRANCH: ${{ inputs.memory_branch }}
        MEMORY_LINES: ${{ inputs.memory_lines }}
      run: bash "${{ github.action_path }}/scripts/memory.sh" save

    # !cancelled(): a failed run is exactly when you want to be told why, and
    # a bare red X with no comment is the worst outcome for someone who typed
    # /fx and walked away. A cancelled one was superseded; say nothing.
    - name: Post the answer
      id: comment
      if: ${{ !cancelled() && steps.integrity.outcome != 'failure' && inputs.post == 'comment' && steps.context.outputs.issue_number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        RESPONSE_PATH: ${{ steps.run.outputs.response_path }}
        COMMENT_KEY: ${{ inputs.comment_key }}
        MODEL: ${{ steps.configure.outputs.model }}
        COST: ${{ steps.memory_save.outputs.cost || steps.pr.outputs.cost || steps.run.outputs.cost }}
        COST_ESTIMATED: ${{ steps.memory_save.outputs.cost_estimated || steps.pr.outputs.cost_estimated || steps.run.outputs.cost_estimated }}
        PROVIDERS: ${{ steps.memory_save.outputs.providers || steps.pr.outputs.providers || steps.run.outputs.providers }}
        DURATION: ${{ steps.run.outputs.duration }}
        IN_TOKENS: ${{ steps.run.outputs.input_tokens }}
        OUT_TOKENS: ${{ steps.run.outputs.output_tokens }}
        PR_URL: ${{ steps.pr.outputs.pr_url }}
        RUN_FAILED: ${{ steps.run.outcome }}
        MEMORY: ${{ steps.memory_save.outputs.memory }}
      run: bash "${{ github.action_path }}/scripts/post-comment.sh"

    - name: Take the reaction back off
      if: ${{ always() && steps.react.outputs.reaction_id != '' }}
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMENT_ID: ${{ github.event.comment.id }}
        REVIEW_COMMENT: ${{ github.event.comment.pull_request_review_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        REACTION_ID: ${{ steps.react.outputs.reaction_id }}
      run: bash "${{ github.action_path }}/scripts/react.sh" remove
