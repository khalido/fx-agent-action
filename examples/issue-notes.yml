# One short note on an issue, refreshed in place when someone comments
# /fx.
#
# The instructions live in .github/fx/issue-notes.md in YOUR repo, so the agent
# is edited without touching this workflow. Start from prompts/issue-notes.md
# in this repo.

name: fx issue notes

on:
  # Switch this on once you like the notes:
  # issues:
  #   types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: fx-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  note:
    # Never a PR (issue_comment fires for those too), and only a comment that
    # contains the phrase. The action then checks that the commenter has write
    # access and is not a bot, and fails the run if not.
    if: >-
      github.event.issue.pull_request == null &&
      (
        github.event_name == 'issues' ||
        (
          contains(github.event.comment.body, '/fx') &&
          github.event.comment.user.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: khalido/fx-agent-action@main
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          prompt_file: .github/fx/issue-notes.md
          model: deepseek/deepseek-v4.1-flash
          mode: read
          # Only needed with `issues: opened` switched on above: the actor is
          # then whoever opened the issue, and anyone can. Safe here because
          # the prompt is fixed and the run cannot write — the most a stranger
          # controls is the issue the agent reads, and that is fenced as
          # evidence.
          # allowed_non_write_users: '*'
