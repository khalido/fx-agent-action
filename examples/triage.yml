# Label a new issue from the labels the repo already has.
#
# Shows the other way to use this action: `post: none`, so nothing is commented
# and the answer comes back on the `response` output for a later step to act on.
# The agent stays read-only and never touches the GitHub API — it picks from a
# list and the workflow applies the choice. A model that cannot label cannot
# invent a label, and the step that can is four lines you can read.

name: fx triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: fx-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the labels this repo actually has
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json name,description \
            --template '{{range .}}{{.name}} — {{.description}}{{"\n"}}{{end}}' \
            > labels.txt
          echo "count=$(wc -l < labels.txt)" >> "$GITHUB_OUTPUT"

      - uses: khalido/fx-agent-action@main
        id: fx
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          mode: read
          post: none
          # The actor is whoever opened the issue, and anyone can. Fine here:
          # the prompt is fixed, the run cannot write, and the only thing it
          # can do with the answer is pick from labels that already exist.
          allowed_non_write_users: '*'
          prompt: |
            Pick the labels for this issue. Read `labels.txt` for the ones this
            repository has, and read enough of the code to tell which area the
            issue is about.

            Reply with the label names on one line, comma separated, and
            nothing else. Only names from that file, at most three, and none at
            all if none of them fit — an empty reply is a fine answer.

      - name: Apply them
        if: ${{ steps.fx.outputs.response != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          PICKED: ${{ steps.fx.outputs.response }}
        run: |
          set -euo pipefail
          # One line, names only, and each one checked against the list the
          # repo actually has before anything is applied. The model read that
          # list, but it also read the issue, and the issue is untrusted.
          keep=()
          IFS=',' read -ra picked <<< "$(printf '%s' "$PICKED" | head -n1 | tr -d '`"')"
          for name in "${picked[@]}"; do
            name=$(printf '%s' "$name" | xargs)
            [ -n "$name" ] || continue
            if grep -qxF -- "$name" <(sed 's/ — .*//' labels.txt); then
              keep+=("$name")
            else
              echo "::warning::Ignoring '$name': not a label this repo has."
            fi
          done
          [ "${#keep[@]}" -gt 0 ] || { echo "No labels picked."; exit 0; }
          echo "Applying: ${keep[*]}"
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$(IFS=,; echo "${keep[*]}")"
